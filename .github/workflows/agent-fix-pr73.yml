name: Apply PR 73 review fix

on:
  push:
    branches:
      - agent/issue-71-interview-provenance
    paths:
      - .github/workflows/agent-fix-pr73.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-71-interview-provenance
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize canonical tier policy and Flow copy
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "docs/pipeline.md",
              """expected; **the author owns the green light** and marks the brief `Ready to draft` from\nthe phone when they're happy. **The answers are the raw material; a brief that has not\nbeen marked ready produces a Note at most, never a ghost-written Essay.**""",
              """expected; **the author owns the green light** and marks the brief `Ready to draft` from\nthe phone when they're happy. **The answers are the raw material; a brief that has not\nbeen marked ready produces a Note at most, never a ghost-written Essay.** Ready means\npermission to use the supplied answers in publishable work; it does not select the Essay\ntier or promise a complete argument.""",
          )
          replace_once(
              "docs/pipeline.md",
              """The skip-by-default rule is replaced by a **fallback ladder**. The drafter always\nproduces the highest rung available:\n\n1. **A brief is marked `Status: Ready to draft`** (the author's explicit green light) →\n   draft an Essay whose spine is the author's own answers (their claims, their examples,\n   their phrasing where usable), with scout research as supporting evidence. Re-validate\n   sources before drafting. Only a ready brief earns the full-Essay treatment.""",
              """The skip-by-default rule is replaced by a **fallback ladder**. The drafter always\nproduces the highest rung the material honestly supports:\n\n1. **A brief is marked `Status: Ready to draft`** (the author's explicit green light) →\n   the answers are authorized for publishable use. Build the Author Kernel first,\n   re-validate external sources, then choose the smallest honest form supported by the\n   material. A ready brief may support an Essay, but readiness does not override an\n   epistemic/domain boundary, a tentative claim, or an unresolved author-judgment\n   question; those may cap the piece at a Note or remain unresolved.""",
          )

          replace_once(
              "docs/pipeline.zh.md",
              """作者用 15–30 分钟作答，任一语言，语音倾倒的质量——碎片、中英混排、错别字都没关系。先答几题、回头再补是预期之内的；**绿灯归作者所有**，作者满意时在手机上把提纲标为 `Ready to draft`。**答案是原材料；一份没有被标记为就绪的提纲最多产出一篇笔记，绝不产出一篇代笔的文章。**""",
              """作者用 15–30 分钟作答，任一语言，语音倾倒的质量——碎片、中英混排、错别字都没关系。先答几题、回头再补是预期之内的；**绿灯归作者所有**，作者满意时在手机上把提纲标为 `Ready to draft`。**答案是原材料；一份没有被标记为就绪的提纲最多产出一篇笔记，绝不产出一篇代笔的文章。** `Ready` 只代表这些答案可以用于可发表内容；它不自动选择文章层级，也不承诺把尚未想完的论证补完整。""",
          )
          replace_once(
              "docs/pipeline.zh.md",
              """\"默认跳过\"规则被一个**回退阶梯**取代。起草者永远产出可得的最高一级：\n\n1. **提纲被标为 `Status: Ready to draft`**（作者明确的绿灯）→ 起草一篇文章，其脊柱是作者自己的答案（他们的主张、例子、能用的措辞），以侦察的研究作为支撑证据。起草前重新校验来源。只有就绪的提纲才配得上完整文章的待遇。""",
              """\"默认跳过\"规则被一个**回退阶梯**取代。起草者永远产出材料诚实支撑的最高一级：\n\n1. **提纲被标为 `Status: Ready to draft`**（作者明确的绿灯）→ 这些答案获准用于可发表内容。先建立作者内核、重新校验外部来源，再选择材料所支撑的最小诚实形式。就绪的提纲可以支撑一篇文章，但 `Ready` 不会覆盖作者明确的知识/领域边界、尚未确定的判断或仍未回答的作者判断题；这些限制可以把作品收窄成笔记，也可以让问题继续保持未解决。""",
          )

          replace_once(
              "worker/flow.ts",
              """      text: allAnswered\n        ? `Interview “${interview.title}” — all ${interview.total} answered. Tap “Ready to draft” so the drafter builds the full Essay ${by}; until you do, it stays a note at most.`\n        : `Interview “${interview.title}” — ${interview.answered} of ${interview.total} answered. Answer what you can, then tap “Ready to draft” when you're happy; that green light is what turns it into a full Essay ${by}.`,""",
              """      text: allAnswered\n        ? `Interview “${interview.title}” — all ${interview.total} answered. Tap “Ready to draft” to authorize the drafter to use these answers ${by}; form and scope still follow the material. Until you do, these answers stay Note-only material at most.`\n        : `Interview “${interview.title}” — ${interview.answered} of ${interview.total} answered. Answer what you can, then tap “Ready to draft” when you're happy; that green light authorizes use of what you supplied ${by}, while form and scope still follow the material.`,""",
          )

          replace_once(
              "tests/flow.test.ts",
              """    expect(item).toBeDefined();\n    expect(item.text).toMatch(/Ready to draft/);\n  });""",
              """    expect(item).toBeDefined();\n    expect(item.text).toMatch(/Ready to draft/);\n    expect(item.text).toMatch(/form and scope still follow the material/i);\n    expect(item.text).not.toMatch(/full Essay/i);\n  });\n\n  it('does not promise an Essay before all interview questions are answered', async () => {\n    const { data } = await call(worker, makeEnv(), 'GET', '/api/flow');\n    const item = data.needsYou.find((n: any) => n.href === '/interview/');\n    expect(item).toBeDefined();\n    expect(item.text).toMatch(/authorizes use of what you supplied/i);\n    expect(item.text).toMatch(/form and scope still follow the material/i);\n    expect(item.text).not.toMatch(/full Essay/i);\n  });""",
          )
      - run: npm ci
      - name: Run Flow regression tests
        run: npx vitest run tests/flow.test.ts
      - name: Commit review fix and remove temporary workflow
        run: |
          rm .github/workflows/agent-fix-pr73.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pipeline.md docs/pipeline.zh.md worker/flow.ts tests/flow.test.ts .github/workflows/agent-fix-pr73.yml
          git commit -m "fix: synchronize ready-to-draft tier policy"
          git push origin HEAD:agent/issue-71-interview-provenance
